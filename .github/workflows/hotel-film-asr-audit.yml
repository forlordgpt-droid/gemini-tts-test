name: Hotel Film — ASR Dialogue Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotel-film-asr-audit.yml'

permissions:
  contents: read

jobs:
  dialogue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native-audio analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper
      - name: Recover existing source media by UUID (no generation)
        env:
          SNAPGEN_API_KEY: \${{ secrets.SNAPGEN_API_KEY }}
        run: python film/download_snapgen_assets.py
      - name: Transcribe and time-align original clip dialogue
        run: python film/asr_diagnose_original_dialogue.py
      - name: Upload transcript and word timestamps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-film-word-level-ASR-audit
          path: hotel-asr-report/
          retention-days: 30
          if-no-files-found: warn
