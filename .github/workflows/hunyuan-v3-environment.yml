name: Hunyuan Cinematic Engine V3 — Build and Publish Locked Environment
# V3 full release: immutable art directives and real original video, offline source bundle, validated longform planner and no-install CPU shards.
on:
  push:
    branches: [hunyuan-cinematic-engine-v3-20261117]
    paths: ['.github/workflows/hunyuan-v3-environment.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: hunyuan-v3-locked-environment-image
  cancel-in-progress: false
jobs:
  preflight-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine:v3.0.0-locked
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EXACT reference MP4 from successful original GitHub Actions run
        uses: actions/download-artifact@v4
        with:
          run-id: 44029412483
          name: HUNYUAN_FIRST_30S_PARALLAX_PREVIEW_AND_QA
          github-token: ${{ github.token }}
          path: film/cinematic-engine-v3/reference_input
      - name: Build the offline production source + unchanged original video/rig/instruction ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 film/cinematic-engine-v3/scripts/package_release.py
          test -s release/HUNYUAN_CINEMATIC_ENGINE_V3_SOURCE_AND_UNCHANGED_REFERENCES.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HUNYUAN_V3_OFFLINE_ENGINE_AND_UNCHANGED_USER_REFERENCES
          path: release/HUNYUAN_CINEMATIC_ENGINE_V3_SOURCE_AND_UNCHANGED_REFERENCES.zip
          retention-days: 30
      - name: Block production if locked sources changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,subprocess
          root=pathlib.Path('film/cinematic-engine-v3')
          spec=json.loads((root/'config/ORIGINAL_REFERENCE_SHA256.json').read_text())
          for x in spec['text_files']:
            p=root/x['path']
            assert p.stat().st_size==x['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],p
          origin=pathlib.Path('film/hunyuan-2m')
          for name in ('HUNYUAN_2D_CHARACTER_PACKAGE.zip','HUNYUAN_30S_PARALLAX_SOURCE.zip'):
            x=next(v for v in spec['references'] if v['filename']==name)
            p=origin/name
            assert p.stat().st_size==x['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],p
            with zipfile.ZipFile(p) as z:assert z.testzip() is None
          x=next(v for v in spec['references'] if v['filename']=='HUNYUAN_FIRST_30S_PARALLAX_PREVIEW.mp4')
          movie=root/'reference_input'/x['filename']
          assert movie.stat().st_size==x['bytes']
          assert hashlib.sha256(movie.read_bytes()).hexdigest()==x['sha256']
          print('PASS byte-for-byte authentic instructions, original 2D rig, original source, ACTUAL approved 30s MP4')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build once and publish reusable SHA-locked production image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: film/cinematic-engine-v3/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine:v3.0.0-locked
          cache-from: type=gha,scope=hunyuan-engine-v3
          cache-to: type=gha,mode=max,scope=hunyuan-engine-v3
      - name: Confirm the published image really runs the ORIGINAL artistic source
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          mkdir -p smoke-qa
          docker run --rm --ipc=host "$IMAGE" python3 /opt/cinematic/engine/scripts/doctor.py --check
          docker run --rm --ipc=host "$IMAGE" bash -lc "python3 -m compileall -q /opt/cinematic/engine/scripts && test -s /opt/cinematic/engine/scripts/temporal_export.bundle.js"
          docker run --rm --ipc=host "$IMAGE" python3 /opt/cinematic/engine/scripts/orchestrator.py plan --manifest /opt/cinematic/engine/examples/APPROVED_ORIGINAL_30S_REFERENCE_STORY.json --phase first30 --shard-seconds 10 --max-parallel 8
          docker run --rm --ipc=host -e ENGINE_SMOKE_OUTPUT=/smoke-qa \
            -v "$PWD/smoke-qa:/smoke-qa" \
            "$IMAGE" node /opt/cinematic/engine/scripts/browser_smoke.cjs
          test -s smoke-qa/REGRESSION_RESULTS.json
          # Exercise the ACTUAL reusable WebCodecs shard exporter in the new published
          # image. A basic browser smoke is insufficient: reject double Mediabunny
          # imports, malformed H264 timestamps, or visually frozen footage.
          docker run --rm --ipc=host \
            -v "$PWD/smoke-qa:/smoke-qa" \
            "$IMAGE" node /opt/cinematic/engine/scripts/render_shard.cjs \
              --project /opt/cinematic/examples/preview_30s \
              --start-frame 0 --frame-count 150 --out /smoke-qa/actual-shard
          python3 - <<'PY'
          import json,pathlib
          qc=pathlib.Path('smoke-qa/actual-shard/shard_qc.json')
          assert qc.is_file(), 'Actual Hunyuan V3 video shard did not pass QA'
          data=json.loads(qc.read_text())
          assert data['pass'] and data['frame_count']==150 and data['visible_frame_change'] and data['deterministic'],data
          assert data['first_pts']==0 and data['fps'] if 'fps' in data else data['first_pts']==0
          print('PASS immutable Hunyuan real 150-frame 2.5D WebCodecs/Mediabunny exporter',data)
          PY
          sha256sum film/cinematic-engine-v3/authoritative/*.txt > smoke-qa/IMMUTABLE_INSTRUCTION_FILES_SHA256.txt
          docker image inspect "$IMAGE" --format '{{.RepoDigests}}' > smoke-qa/IMAGE_DIGEST.txt
          echo "PASS: published reusable container, original 2D rig, real authored 150-frame WebCodecs export, actual video and camera checked"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HUNYUAN_V3_ENVIRONMENT_BUILD_AND_ACTUAL_FILM_REGRESSION
          path: smoke-qa/
          retention-days: 30
