name: Last Safe Room — Repair 30s Timestamp and Produce Auditable Visual Master
on:
  push:
    branches: [last-safe-room-full-30s-20261117]
    paths: ['.github/workflows/last-safe-room-30s-timestamps.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reassemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LSR_10S_RAW_APPROVAL_VIDEO_AND_SOURCE
          run-id: 44104478064
          github-token: ${{ github.token }}
          path: approved_original
      - uses: actions/download-artifact@v4
        with:
          pattern: LSR_30S_SHARD_*
          run-id: 44113871109
          github-token: ${{ github.token }}
          path: parts
      - uses: actions/download-artifact@v4
        with:
          name: LSR_30S_CONTINUATION_WEB_AUDIO
          run-id: 44113871109
          github-token: ${{ github.token }}
          path: sound
      - name: Install EXACT required FFmpeg and FFprobe stack
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Decode, norm timestamps and concatenate 5 successful illustrated cinematic clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          python3 - <<'PY'
          from pathlib import Path
          import json
          src=Path('approved_original/LAST_SAFE_ROOM_FIRST_10S_UNCORRECTED_DRAFT.mp4')
          assert src.exists() and src.stat().st_size>1_000_000
          for j in range(4):
            f=Path('parts')/('LSR_30S_SHARD_'+str(j))/('part_'+str(j)+'.mp4')
            assert f.exists() and f.stat().st_size>500_000,f
          assert Path('sound/sfx_20.wav').exists()
          print('Five original visual segments verified; approved first10 unchanged creatively')
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -i approved_original/LAST_SAFE_ROOM_FIRST_10S_UNCORRECTED_DRAFT.mp4 \
            -i parts/LSR_30S_SHARD_0/part_0.mp4 \
            -i parts/LSR_30S_SHARD_1/part_1.mp4 \
            -i parts/LSR_30S_SHARD_2/part_2.mp4 \
            -i parts/LSR_30S_SHARD_3/part_3.mp4 \
            -filter_complex '[0:v]trim=duration=10,fps=30,setpts=N/(30*TB)[v0];[1:v]trim=duration=5,fps=30,setpts=N/(30*TB)[v1];[2:v]trim=duration=5,fps=30,setpts=N/(30*TB)[v2];[3:v]trim=duration=5,fps=30,setpts=N/(30*TB)[v3];[4:v]trim=duration=5,fps=30,setpts=N/(30*TB)[v4];[v0][v1][v2][v3][v4]concat=n=5:v=1:a=0,format=yuv420p[v]' \
            -map '[v]' -an -c:v libx264 -preset medium -crf 17 -r 30 \
            -movflags +faststart delivery/video_timestamp_corrected.mp4
          # Original approved first10 soundtrack is retained; 20s has only WebAudio.
          ffmpeg -hide_banner -loglevel error -y \
            -i approved_original/LAST_SAFE_ROOM_FIRST_10S_UNCORRECTED_DRAFT.mp4 \
            -vn -ar 24000 -ac 1 delivery/approved_first10_audio.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i delivery/approved_first10_audio.wav -i sound/sfx_20.wav \
            -filter_complex '[0:a]atrim=0:10,asetpts=PTS-STARTPTS[a];[1:a]atrim=0:20,asetpts=PTS-STARTPTS[b];[a][b]concat=n=2:v=0:a=1[s]' \
            -map '[s]' -c:a pcm_s16le delivery/visual_audio_without_kie.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i delivery/video_timestamp_corrected.mp4 -i delivery/visual_audio_without_kie.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -t 30 \
            -movflags +faststart delivery/LAST_SAFE_ROOM_30S_VISUAL_MASTER_NEEDS_KIE_DIALOGUE.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames,sample_rate:format=duration -of json \
            delivery/LAST_SAFE_ROOM_30S_VISUAL_MASTER_NEEDS_KIE_DIALOGUE.mp4 > delivery/ffprobe.json
          python3 - <<'PY'
          import json,subprocess,pathlib
          p=pathlib.Path('delivery/LAST_SAFE_ROOM_30S_VISUAL_MASTER_NEEDS_KIE_DIALOGUE.mp4')
          d=json.load(open('delivery/ffprobe.json'))
          v=next(x for x in d['streams'] if x['codec_type']=='video')
          a=next(x for x in d['streams'] if x['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'],int(v['nb_frames']))==('h264',1920,1080,'30/1',900),v
          assert a['codec_name']=='aac'
          assert abs(float(d['format']['duration'])-30)<.09,d
          raw=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0',
             '-show_entries','frame=best_effort_timestamp_time','-of','csv=p=0',str(p)],text=True)
          times=[float(line.strip()) for line in raw.splitlines() if line.strip()]
          assert len(times)==900,len(times)
          for i in (0,120,299,300,449,450,599,600,749,750,899):
            assert abs(times[i]-i/30)<.035,(i,times[i],i/30)
          assert all(times[i+1]>times[i] for i in range(899)),'Bad monotonic frame times'
          pathlib.Path('delivery/QC.json').write_text(json.dumps({
              'status':'VIDEO_TECHNICAL_PASS_KIE_VOICES_NOT_GENERATED_OR_CHARGED',
              'video_frames':900,'duration_seconds':30,'width':1920,'height':1080,'fps':30,
              'first_300_frames':'Approved first10 decoded and visually retained with recompression to normalize timestamps',
              'remaining_600_frames':'4 x 150-frame shards from run 44113871109',
              'timestamp_strictly_monotonic':True,'timing_check_sample_frames':[0,120,299,300,449,450,599,600,749,750,899],
              'new_snapgen_model':'gpt-image-2.5-lower','new_snapgen_images':4,'new_snapgen_credits_used':4,
              'audio':'First approved 10 seconds plus 20 seconds original OfflineAudioContext SFX; no dialogue',
              'additional_kie_calls':0,
              'next_gate':'User must explicitly authorize Kie model google/gemini-3-8-flash-tts quantity and max credits; then add three lines of Noah/Emma dialogue',
              'codec':v['codec_name'],'file_bytes':p.stat().st_size
            },indent=2))
          print('PASS 900 sequentially timestamped 1080p frames over 30.00 seconds')
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -i delivery/LAST_SAFE_ROOM_30S_VISUAL_MASTER_NEEDS_KIE_DIALOGUE.mp4 \
            -vf 'fps=1/3,scale=640:-1,tile=5x2' -frames:v 1 delivery/CORRECTED_CONTACT_SHEET.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LSR_30S_CORRECTED_VISUAL_MASTER_PENDING_KIE
          path: |
            delivery/LAST_SAFE_ROOM_30S_VISUAL_MASTER_NEEDS_KIE_DIALOGUE.mp4
            delivery/CORRECTED_CONTACT_SHEET.jpg
            delivery/QC.json
            delivery/ffprobe.json
          retention-days: 30
