name: Last Safe Room ONE approved Kie Gemini 3.8 Flash TTS task max 5 credits
on:
  push:
    branches: [last-safe-room-full-30s-20261117]
    paths: ['.github/workflows/lsr-one-kie-flash-tts.yml']
  workflow_dispatch:
concurrency:
  group: lsr-one-authorized-kie-flash-tts-job-20261117
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  only-once-two-speaker-kie:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify the immutable three story lines and strict approved cost before spending
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open('film/last-safe-room-30s/tts/APPROVED_KIE_FLASH_TTS_ONE_TASK.json'))
          assert m['model']=='google/gemini-3-8-flash-tts',m
          assert m['provider']=='kie.ai'
          assert (m['approved_generation_jobs'],m['maximum_kie_credits'])==(1,5)
          assert len(m['dialogue'])==3
          print('ONE 17-word / 3-turn multi-speaker Gemini 3.8 Flash TTS; no other model and no paid retries')
          PY
      - name: Submit the single user-authorized Kie Gemini 3.8 Flash task and audit credits
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: |
          set -euo pipefail
          python3 film/last-safe-room-30s/tts/one_kie_flash_task.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LSR_ONE_KIE_3_8_FLASH_TTS_AND_CREDIT_AUDIT
          path: kie_one_task/
          if-no-files-found: warn
          retention-days: 30
