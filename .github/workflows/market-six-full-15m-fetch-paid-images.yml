name: Market Six Full 15m - Download and verify all 131 prepaid SnapGen originals
on:
  push:
    branches: [market-six-full-film-20261118]
    paths: ['.github/workflows/market-six-full-15m-fetch-paid-images.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  retrieve-only-already-paid-chapter-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chapter: ["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15"]
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original native Hunyuan V3 references and tools
        run: python3 /opt/cinematic/engine/scripts/doctor.py --check
      - name: Download previously PAID 2D painted SnapGen GPT image 2.5 Lower assets - NO GENERATIONS
        env:
          CHAPTER: ${{ matrix.chapter }}
        run: |
          set -euo pipefail
          python3 film/market-six-v3/full-film/download_prepaid_chapter_art.py --chapter "$CHAPTER"
          test -s "film/market-six-v3/full-film/chapter-projects/ch$CHAPTER/initial_art_qa/CHAPTER_SOURCE_PAINTING_AUDIT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_SIX_FULL15M_ORIGINAL_PAINTED_IMAGES_CH${{ matrix.chapter }}
          path: film/market-six-v3/full-film/chapter-projects/ch${{ matrix.chapter }}/
          retention-days: 60
          compression-level: 0
          if-no-files-found: error
