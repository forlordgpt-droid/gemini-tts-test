name: Market Six Full 15m - 87 Original 1080p H264 2.5D CPU Render Shards
on:
  push:
    branches: [market-six-full-film-20261118]
    paths: ['.github/workflows/market-six-full-15m-render-shards.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: market-six-original-87-prepaid-render-shards-20261118
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  original-cinematic-five-dimensional-film-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chapter: ["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15"]
        segment: [0,300,600,900,1200,1500]
        exclude:
          - {chapter: "01", segment: 0}
          - {chapter: "01", segment: 300}
          - {chapter: "01", segment: 600}
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Lock unchanged V3 native 2D reference, exact pinned model and tool stack
        run: |
          set -euo pipefail
          python3 /opt/cinematic/engine/scripts/doctor.py --check
          python3 - <<'PY'
          import json
          m=json.load(open('film/market-six-v3/full-film/paid-generation/ALL_131_ORIGINAL_ILLUSTRATIONS_VERIFIED.json'))
          assert m['exact_model']=='gpt-image-2.5-lower' and m['unique_job_count']==131 and m['all_jobs_successful']
          assert m['verified_credits_spent']==131
          t=json.load(open('film/market-six-v3/full-film/ORIGINAL_STORY_SPOKEN_TURNS.json'))
          assert t['exact_model']=='google/gemini-3-8-flash-tts' and len(t['chapters'])==15
          print('PASS no model substitution, original 131 image paintings, exact speech, zero new paid jobs')
          PY
      - name: Reuse exactly one finished chapter with true image-derived foreground midground and repaired far plates
        uses: actions/download-artifact@v4
        with:
          name: MARKET_SIX_FULL15M_APPROVED_2P5D_PREPARED_CH${{ matrix.chapter }}
          run-id: 44281228495
          github-token: ${{ github.token }}
          path: film/market-six-v3/full-film/chapter-projects/ch${{ matrix.chapter }}/
      - name: Render only assigned 300 deterministic original story frames with PerspectiveCamera GSAP WebCodecs Mediabunny Playwright
        env:
          CHAPTER: ${{ matrix.chapter }}
          SEGMENT: ${{ matrix.segment }}
        run: |
          set -euo pipefail
          CH=$((10#$CHAPTER))
          START=$(((CH-1)*1800+SEGMENT))
          PROJECT="film/market-six-v3/full-film/chapter-projects/ch$CHAPTER"
          test -s "$PROJECT/rig/art.js"
          test -s "$PROJECT/rig/engine.js"
          test -s "$PROJECT/qc/LAYER_MASKS_AND_ARTWORK_QA.json"
          test -s "$PROJECT/scene_manifest.json"
          if [ ! -e "$PROJECT/node_modules" ]; then ln -s /opt/cinematic/node_modules "$PROJECT/node_modules"; fi
          node /opt/cinematic/engine/scripts/render_shard.cjs --project "$PROJECT" --start-frame "$START" --frame-count 300 --out shard/
          test -s "shard/part_$(echo "$START")_300.mp4"
      - name: Verify actual 300 1080p H264 frames and 0-based local WebCodecs timestamps
        env:
          CHAPTER: ${{ matrix.chapter }}
          SEGMENT: ${{ matrix.segment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,subprocess
          chapter=int(os.environ['CHAPTER']);segment=int(os.environ['SEGMENT']);frame=(chapter-1)*1800+segment
          path=Path(f'shard/part_{frame}_300.mp4')
          assert path.is_file() and path.stat().st_size>100000,path
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames:format=duration','-of','json',str(path)]))
          v=next(x for x in data['streams'] if x['codec_type']=='video')
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'],int(v['nb_frames']))==('h264',1920,1080,'30/1',300),(path,v)
          assert abs(float(data['format']['duration'])-10)<.08,(path,data['format'])
          pts=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','frame=best_effort_timestamp_time','-of','csv=p=0',str(path)],text=True)
          values=[float(x.strip()) for x in pts.splitlines() if x.strip()]
          assert len(values)==300 and abs(values[0])<.035 and abs(values[-1]-299/30)<.04,(path,values[:2],values[-2:])
          assert all(b>a for a,b in zip(values,values[1:])),path
          print('PASS independent original image-first parallax film chapter',chapter,'segment',segment,'absolute frame',frame)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_SIX_FULL_CH${{ matrix.chapter }}_SEG${{ matrix.segment }}
          path: shard/
          retention-days: 60
          compression-level: 0
          if-no-files-found: error
