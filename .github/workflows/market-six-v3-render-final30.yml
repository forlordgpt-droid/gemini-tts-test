name: Market Six V3 FINAL Complete First30 900 Frame Cinematic
on:
  push:
    branches: [hunyuan-cinematic-engine-v3-20261117]
    paths: ['.github/workflows/market-six-v3-render-final30.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: market-six-v3-30s-no-paid-retries
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Original immutable V3 environment check
        run: |
          set -euo pipefail
          python3 /opt/cinematic/engine/scripts/doctor.py --check
      - uses: actions/download-artifact@v4
        with:
          name: MARKET_SIX_V3_TEN_ORIGINAL_2D_STORY_PAINTINGS_AND_CONTACT_SHEET
          run-id: 44269868805
          github-token: ${{ github.token }}
          path: film/market-six-v3
      - uses: actions/download-artifact@v4
        with:
          name: MARKET_SIX_V3_ONE_EXACT_KIE_FLASH_VOICE
          run-id: 44269069650
          github-token: ${{ github.token }}
          path: film/market-six-v3/voice
      - name: Restore the ORIGINAL approved native Hunyuan 2D rig, don't recast unrelated characters
        run: |
          set -euo pipefail
          mkdir -p film/market-six-v3/rig
          unzip -p /opt/cinematic/references/HUNYUAN_2D_CHARACTER_PACKAGE.zip HUNYUAN_2D/art.js > film/market-six-v3/rig/art.js
          unzip -p /opt/cinematic/references/HUNYUAN_2D_CHARACTER_PACKAGE.zip HUNYUAN_2D/engine.js > film/market-six-v3/rig/engine.js
      - name: Verify exact paid source models, all eight originals and unmodified 63-word Kie narration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,wave
          from pathlib import Path
          p=Path('film/market-six-v3')
          a=json.loads((p/'RAW_SNAPGEN_ASSETS.json').read_text())
          b=json.loads((p/'voice/COST_AND_AUDIO_QA.json').read_text())
          assert a['model']=='gpt-image-2.5-lower' and a['image_jobs']==10 and a['credits_used']==10
          assert (b['provider'],b['model'],b['jobs_created'],b['words'])==('kie.ai','google/gemini-3-8-flash-tts',1,63)
          assert len(list((p/'raw').glob('raw_*.png')))==8
          with wave.open(str(p/'voice/MARKET_SIX_30S_KIE_GEMINI38_FLASH.wav')) as w:
              assert w.getframerate()==24000 and w.getnchannels()==1
          print('PASS EXACT BOTH PAID MODELS, existing 10 illustrations and ONE Kie Flash WAV, no new paid tasks')
          PY
      - name: Generate REAL transparent layer masks and repaired 2D backgrounds with Pillow and OpenCV
        run: |
          set -euo pipefail
          python3 film/market-six-v3/prepare_layers.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          p=Path('film/market-six-v3')
          report=json.loads((p/'qa/FULL_EIGHT_2P5D_MASK_QA.json').read_text())
          assert report['total_separate_depth_planes']==24 and len(report['scenes'])==8
          for i in range(8):
            for stem,ext in [('far','jpg'),('mid','webp'),('front','webp')]:
              f=p/'assets'/f'{stem}_{i}.{ext}'
              assert f.is_file() and f.stat().st_size>9000,f
              with Image.open(f) as im:assert im.size==(1920,1080)
          print('PASS 24 separately masked/inpainted premium illustrated layers')
          PY
      - name: Render real first eight frames to verify native rig and pinned V3 Three.js GSAP WebCodecs
        run: |
          set -euo pipefail
          ln -s /opt/cinematic/node_modules film/market-six-v3/node_modules
          node /opt/cinematic/engine/scripts/render_shard.cjs --project film/market-six-v3 --start-frame 0 --frame-count 8 --out smoke
          test -s smoke/part_0_8.mp4
      - name: OfflineAudioContext storm and impacts, no extra paid generation
        run: |
          set -euo pipefail
          node film/market-six-v3/export_sfx.cjs
          test -s sfx/MARKET_SIX_OFFLINE_WEBAUDIO_SFX.wav
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_SIX_V3_30S_PREPARED_24_PLANES_KIE_VOICE_WEBAUDIO
          path: |
            film/market-six-v3/raw/
            film/market-six-v3/assets/
            film/market-six-v3/rig/
            film/market-six-v3/voice/
            film/market-six-v3/qa/
            sfx/
            smoke/
          retention-days: 30
          if-no-files-found: error
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        start: [0,150,300,450,600,750]
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MARKET_SIX_V3_30S_PREPARED_24_PLANES_KIE_VOICE_WEBAUDIO
          path: .
      - name: Exactly 150 true 1080p animated original Three.js GSAP frames with local WebCodecs timestamps
        env:
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          python3 /opt/cinematic/engine/scripts/doctor.py --check
          ln -s /opt/cinematic/node_modules film/market-six-v3/node_modules
          node /opt/cinematic/engine/scripts/render_shard.cjs --project film/market-six-v3 --start-frame "$START" --frame-count 150 --out shard
          test -s "shard/part_$(echo "$START")_150.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_SIX_V3_5S_PARALLAX_SHARD_${{ matrix.start }}
          path: shard/
          retention-days: 30
          if-no-files-found: error
  assemble:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MARKET_SIX_V3_30S_PREPARED_24_PLANES_KIE_VOICE_WEBAUDIO
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: MARKET_SIX_V3_5S_PARALLAX_SHARD_*
          path: parts/
          merge-multiple: false
      - name: Verify six 5-second H264 1080p 30fps shards with zero-origin local timestamps
        run: |
          set -euo pipefail
          mkdir -p delivery
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          ps=[]
          for start in [0,150,300,450,600,750]:
            p=Path('parts')/f'MARKET_SIX_V3_5S_PARALLAX_SHARD_{start}'/f'part_{start}_150.mp4'
            assert p.is_file(),p
            d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames:format=duration','-of','json',str(p)]))
            v=next(s for s in d['streams'] if s['codec_type']=='video')
            assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'],int(v['nb_frames']))==('h264',1920,1080,'30/1',150),d
            pts=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','frame=best_effort_timestamp_time','-of','csv=p=0',str(p)],text=True)
            nums=[float(x) for x in pts.splitlines() if x]
            assert len(nums)==150 and abs(nums[0])<.035 and abs(nums[-1]-149/30)<.04,(p,nums[:2],nums[-2:])
            assert all(b>a for a,b in zip(nums,nums[1:])),p
            ps.append(p)
          Path('market_six.concat.txt').write_text(''.join("file '"+str(p.resolve())+"'\n" for p in ps))
          print('PASS 900 unique-time frames in 6 genuine 2.5D movie shards')
          PY
      - name: Finish exactly 30-second H264 AAC movie preserving existing Gemini 3.8 FLASH voice and authored Web Audio SFX
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i market_six.concat.txt -c copy delivery/MARKET_SIX_PICTURE_900FRAMES.mp4
          ffmpeg -hide_banner -loglevel error -y -i delivery/MARKET_SIX_PICTURE_900FRAMES.mp4 -i film/market-six-v3/voice/MARKET_SIX_30S_KIE_GEMINI38_FLASH.wav -i sfx/MARKET_SIX_OFFLINE_WEBAUDIO_SFX.wav \
            -filter_complex '[1:a]apad=whole_dur=30,atrim=end=30,asetpts=N/SR/TB,volume=1.0[n];[2:a]volume=.17[s];[n][s]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=.95[m]' \
            -map 0:v:0 -map '[m]' -t 30 -c:v copy -c:a aac -b:a 192k -ar 24000 -ac 1 -movflags +faststart \
            delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4
          test -s delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4
      - name: Decode full movie, reject frozen frames and produce 16-shot real video contact sheet
        run: |
          set -euo pipefail
          python3 /opt/cinematic/engine/scripts/qa_video.py --video delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4 --frames 900 --seconds 30 --sample-every .5 --out delivery/qc
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames,sample_rate,channels:format=duration -of json delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4 > delivery/FINAL_FFPROBE.json
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,cv2,numpy as np,hashlib
          p=Path('delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4')
          info=json.loads(Path('delivery/FINAL_FFPROBE.json').read_text())
          v=next(s for s in info['streams'] if s['codec_type']=='video')
          au=next(s for s in info['streams'] if s['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'],int(v['nb_frames']))==('h264',1920,1080,'30/1',900),info
          assert au['codec_name']=='aac' and abs(float(info['format']['duration'])-30)<.14,info
          cap=cv2.VideoCapture(str(p));assert cap.isOpened()
          times=[.2,1.3,2.6,4.5,6.1,8.2,9.7,11.5,13.6,15.6,17.8,19.8,21.6,24,26.5,29.2]
          imgs=[]
          for t in times:
            cap.set(cv2.CAP_PROP_POS_MSEC,t*1000)
            ok,f=cap.read();assert ok,t
            imgs.append(Image.fromarray(cv2.cvtColor(cv2.resize(f,(640,360)),cv2.COLOR_BGR2RGB)))
          cap.release()
          sh=Image.new('RGB',(2560,1540),'#081524');d=ImageDraw.Draw(sh)
          for i,(t,im) in enumerate(zip(times,imgs)):
            x=i%4*640;y=i//4*385;sh.paste(im,(x,y+24));d.text((x+14,y+4),f'{t:.1f}s ACTUAL MOVIE',fill='#fff1d3')
          sh.save('delivery/MARKET_SIX_ACTUAL_30S_VIDEO_CONTACT_SHEET.jpg',quality=90)
          diffs=[float(np.mean(np.abs(np.asarray(a,dtype='int16')-np.asarray(b,dtype='int16')))) for a,b in zip(imgs,imgs[1:])]
          assert all(d>1.5 for d in diffs),diffs
          audit={'status':'PASS_DECODED_900_REAL_FRAMES_H264_AAC_FIRST30','video_dimensions':[1920,1080],'fps':30,'frames':900,'seconds':float(info['format']['duration']),'image_model':'gpt-image-2.5-lower','image_credits':10,'voice_model':'google/gemini-3-8-flash-tts','voice_jobs':1,'story':'100 DAYS INSIDE AN ABANDONED SUPERMARKET DAY 100','separate_illustrated_depth_planes':24,'actual_video_time_samples':times,'actual_time_sample_frame_differences':diffs,'video_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'new_paid_jobs_in_render':0}
          Path('delivery/MARKET_SIX_FINAL_CINEMATIC_QA.json').write_text(json.dumps(audit,indent=2))
          print('PASS H264 AAC 900 actual animated frames and no flat slideshow',audit['video_sha256'])
          PY
      - name: Archive original first30 2D art, native rig, source project, layer masks and all audio for reuse
        run: |
          set -euo pipefail
          zip -q -r delivery/MARKET_SIX_V3_FULL_FIRST30_SOURCE.zip film/market-six-v3 sfx -x 'film/market-six-v3/node_modules/*'
          sha256sum delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4 > delivery/SHA256_MP4.txt
          test -s delivery/MARKET_SIX_V3_FULL_FIRST30_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_SIX_DAY100_FINAL_30S_MP4_ONLY
          path: delivery/MARKET_SIX_DAY100_COMPLETE_FIRST30_1080P.mp4
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MARKET_SIX_V3_FINAL_30S_SOURCE_AND_QA
          path: |
            delivery/FINAL_FFPROBE.json
            delivery/MARKET_SIX_FINAL_CINEMATIC_QA.json
            delivery/MARKET_SIX_ACTUAL_30S_VIDEO_CONTACT_SHEET.jpg
            delivery/MARKET_SIX_V3_FULL_FIRST30_SOURCE.zip
            delivery/SHA256_MP4.txt
            delivery/qc/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
