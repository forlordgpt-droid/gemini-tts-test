name: Rain V4 - Restore Verified Video Shards and Finish MP4
on:
  push:
    branches: [rain-v4-first10-20261119]
    paths:
      - .github/workflows/rain-v4-first10-recover.yml
      - film/rain-v4-first10/render_sfx_recover.cjs
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    name: Reuse both rendered shards, generate corrected WebAudio, and assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recheck exact immutable engine, no paid generation
        run: python3 /opt/cinematic/engine/scripts/doctor.py --check
      - name: Generate rainy ambiance in the required Web Audio OfflineAudioContext
        env:
          NODE_PATH: /opt/cinematic/node_modules
        run: |
          set -euo pipefail
          node film/rain-v4-first10/render_sfx_recover.cjs "${GITHUB_WORKSPACE}/film/rain-v4-first10/scenes" "${GITHUB_WORKSPACE}/rain_sfx.wav"
          ffprobe -v error -show_entries format=duration -of default=nw=1 rain_sfx.wav
      - name: Restore verified rendered frames 0 to 149 from prior attempt
        uses: actions/download-artifact@v4
        with:
          name: RAIN_V4_VIDEO_0
          run-id: 44619313827
          github-token: ${{ github.token }}
          repository: forlordgpt-droid/gemini-tts-test
          path: parts/RAIN_V4_VIDEO_0
      - name: Restore verified rendered frames 150 to 299 from prior attempt
        uses: actions/download-artifact@v4
        with:
          name: RAIN_V4_VIDEO_150
          run-id: 44619313827
          github-token: ${{ github.token }}
          repository: forlordgpt-droid/gemini-tts-test
          path: parts/RAIN_V4_VIDEO_150
      - name: Install corrected synthesized rain soundtrack into shard bundle
        run: |
          set -euo pipefail
          cp rain_sfx.wav parts/RAIN_V4_VIDEO_0/rain_sfx.wav
      - name: Retrieve exact approved Kie Flash narration, no paid task
        uses: actions/download-artifact@v4
        with:
          name: RAIN_V4_FIRST10_ONE_EXACT_KIE_FLASH_NARRATION
          run-id: 44611887861
          github-token: ${{ github.token }}
          repository: forlordgpt-droid/gemini-tts-test
          path: narration
      - name: Verify 300 frames and compose MP4 with existing narration and synthesized ambience
        run: |
          set -euo pipefail
          mkdir -p delivery
          test -s parts/RAIN_V4_VIDEO_0/part_0_150.mp4
          test -s parts/RAIN_V4_VIDEO_150/part_150_150.mp4
          test -s parts/RAIN_V4_VIDEO_0/rain_sfx.wav
          test -s narration/RAIN_V4_FIRST10_KIE_GEMINI38_FLASH_RAW.wav
          echo "3452446cf95e8da4e5b01b30cb8efa077b6411ad376aa1040f090676eef7694e  narration/RAIN_V4_FIRST10_KIE_GEMINI38_FLASH_RAW.wav" | sha256sum -c -
          python3 - <<'PY'
          import json,subprocess,pathlib
          for first in (0,150):
            p=pathlib.Path('parts')/f'RAIN_V4_VIDEO_{first}'/f'part_{first}_150.mp4'
            q=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,width,height,r_frame_rate,nb_frames:format=duration','-of','json',str(p)]))
            s=q['streams'][0]
            assert s['codec_name']=='h264' and (s['width'],s['height'],s['r_frame_rate'],int(s['nb_frames']))==(1920,1080,'30/1',150),(p,s)
            assert abs(float(q['format']['duration'])-5)<0.1
          paths=[pathlib.Path('parts')/f'RAIN_V4_VIDEO_{n}'/f'part_{n}_150.mp4' for n in (0,150)]
          pathlib.Path('join.txt').write_text(''.join("file '"+str(p.resolve())+"'\n" for p in paths))
          PY
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i join.txt -c copy delivery/VIDEO_ONLY_FIRST10.mp4
          ffmpeg -hide_banner -loglevel error -y -i delivery/VIDEO_ONLY_FIRST10.mp4 -i narration/RAIN_V4_FIRST10_KIE_GEMINI38_FLASH_RAW.wav -i parts/RAIN_V4_VIDEO_0/rain_sfx.wav \
            -filter_complex "[1:a]adelay=140,aresample=48000,volume=1.0[n];[2:a]aresample=48000,volume=0.35[s];[n][s]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=0.94,afade=t=out:st=9.55:d=0.45[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -t 10 -movflags +faststart delivery/RAIN_V4_FIRST10_UNCORRECTED.mp4
          python3 - <<'PY'
          import json,subprocess,hashlib,pathlib
          p=pathlib.Path('delivery/RAIN_V4_FIRST10_UNCORRECTED.mp4')
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames:format=duration','-of','json',str(p)]))
          v=next(s for s in d['streams'] if s['codec_type']=='video');a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'],int(v['nb_frames']))==('h264',1920,1080,'30/1',300),v
          assert a['codec_name']=='aac' and abs(float(d['format']['duration'])-10)<0.12,d
          subprocess.check_call(['ffmpeg','-hide_banner','-loglevel','error','-i',str(p),'-f','null','-'])
          r={'status':'TECHNICAL_PASS_VISUAL_REVIEW_REQUIRED','frames':300,'fps':30,'resolution':'1920x1080','duration_seconds':float(d['format']['duration']),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'narration_credits_existing':0.29,'new_paid_generations':0,'speech_source_run':44611887861,'creative_review':'USER_APPROVAL_REQUIRED'}
          pathlib.Path('delivery/QA_FIRST10.json').write_text(json.dumps(r,indent=2));print(json.dumps(r,indent=2))
          PY
          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import subprocess,io
          out=Image.new('RGB',(1920,760),'#13202f');draw=ImageDraw.Draw(out)
          for i,t in enumerate((.4,2.3,3.7,5.2,6.9,9.3)):
            b=subprocess.check_output(['ffmpeg','-hide_banner','-loglevel','error','-ss',str(t),'-i','delivery/RAIN_V4_FIRST10_UNCORRECTED.mp4','-vframes','1','-f','image2pipe','-vcodec','mjpeg','-'])
            im=ImageOps.fit(Image.open(io.BytesIO(b)).convert('RGB'),(640,360))
            x=i%3*640;y=i//3*380;out.paste(im,(x,y+20));draw.text((x+12,y+4),f'{t:.1f}s',fill='white')
          out.save('delivery/RAIN_V4_FIRST10_CONTACT_SHEET.jpg',quality=88)
          PY
          cp film/rain-v4-first10/preview_manifest.json delivery/
          cp narration/NARRATION_AUDIT.json delivery/
          cp parts/RAIN_V4_VIDEO_0/shard_qc.json delivery/shard_0_qc.json
          cp parts/RAIN_V4_VIDEO_150/shard_qc.json delivery/shard_150_qc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAIN_V4_FIRST10_UNCORRECTED_MP4_AND_QA
          path: delivery/
          retention-days: 30
          if-no-files-found: warn
