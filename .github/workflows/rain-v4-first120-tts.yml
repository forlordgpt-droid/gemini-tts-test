name: Ten Years of Rain V4 2min - Five Authorized Fola Continuations
on:
  push:
    branches: [rain-v4-first120-20261119]
    paths: ['.github/workflows/rain-v4-first120-tts.yml']
  workflow_dispatch:
concurrency:
  group: rain-v4-first120-five-exact-kie-flash-tasks
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  one-authorized-voice:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        segment: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact Fola model, words and single-task bound
        run: |
          python3 film/rain-v4-first120/voice/s${{ matrix.segment }}/generate_narration.py --request film/rain-v4-first120/voice/s${{ matrix.segment }}/request.json --authorization film/rain-v4-first120/voice/s${{ matrix.segment }}/authorization.json --validate-only
      - name: Submit one Kie Gemini 3.8 Flash TTS task for this segment
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: |
          set -euo pipefail
          python3 film/rain-v4-first120/voice/s${{ matrix.segment }}/generate_narration.py --request film/rain-v4-first120/voice/s${{ matrix.segment }}/request.json --authorization film/rain-v4-first120/voice/s${{ matrix.segment }}/authorization.json --output-dir rain120-audio-s${{ matrix.segment }} --poll-timeout 780
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAIN_V4_30TO120_FOLA_S${{ matrix.segment }}
          path: rain120-audio-s${{ matrix.segment }}/
          retention-days: 30
          if-no-files-found: warn
