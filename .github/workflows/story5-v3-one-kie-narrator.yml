name: Emma Story5 — ONE approved Kie Gemini 3.8 Flash narrated 10s voice (5 credit proposed ceiling)
on:
  push:
    branches: [hunyuan-cinematic-engine-v3-20261117]
    paths: ['.github/workflows/story5-v3-one-kie-narrator.yml']
  workflow_dispatch:
concurrency:
  group: story5-kie-one-authorized-narrator-20261117
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  narration-once:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/forlordgpt-droid/hunyuan-cinematic-engine@sha256:4026e6a686120cbed05b650bbecda54c377fcd91fbb56b844e9f87fdc6ef4df7
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged original V3 engine and mandatory exact toolchain
        run: python3 /opt/cinematic/engine/scripts/doctor.py --check
      - name: Confirm once-only explicit credit approval, exact narrator words and no retries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          m=json.load(open('film/story5-v3/narrated-first10/NARRATION_LOCKED_FIRST10_MANIFEST.json'))
          assert m['narration_mode']=='SINGLE_NARRATOR_VERBATIM'
          assert m['tts']['model']=='google/gemini-3-8-flash-tts'
          assert m['tts']['provider']=='kie.ai'
          assert m['tts']['approved_generation_jobs']==1
          assert m['tts']['authorized_credits']==5
          assert m['tts']['user_acknowledged_no_hard_cap'] is True
          assert m['tts']['automatic_retries_allowed'] is False
          assert m['image_reuse']['new_jobs']==0
          assert os.environ.get('GITHUB_RUN_NUMBER')=='1'
          assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          print('PASS: user explicitly approved ONE Kie Flash narrator job, 5 credit proposed maximum, no hard provider enforcement and no retries; exact story only')
          PY
      - name: Submit ONE paid Kie 3.8 Flash narration request, then poll SAME task and audit credits
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        run: |
          set -euo pipefail
          python3 film/story5-v3/narrated-first10/generate_one_kie_narrator.py
      - name: Preserve narrator WAV, actual credit audit, request manifest and paid task ID
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORY5_FIRST10_SINGLE_KIE_FLASH_NARRATOR_AND_CREDIT_AUDIT
          path: story5_first10_narrator/
          if-no-files-found: warn
          retention-days: 30
