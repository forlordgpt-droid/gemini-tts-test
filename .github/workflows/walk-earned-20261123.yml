name: The Walk He Earned - Render 45s Vertical Film

on:
  push:
    paths:
      - '.github/workflows/walk-earned-20261123.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-walk-he-earned-20261123
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out this production branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -n 1

      - name: Retrieve the four verified Snapgen assets by UUID
        env:
          SNAPGEN_API_KEY: ${{ secrets.SNAPGEN_API_KEY }}
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "film")
          import download_snapgen_assets as d
          d.MANIFEST = Path("walk_earned/manifest.json")
          d.OUTPUT = Path("walk_earned/assets")
          sys.exit(d.main())
          PY

      - name: Assemble, caption, mix original score, export and validate
        run: python walk_earned/build.py

      - name: Upload film, clean copy, cover and technical report
        uses: actions/upload-artifact@v4
        with:
          name: The_Walk_He_Earned_45s_480p_Final
          path: |
            walk_earned/final/
            walk_earned/assets/download-report.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
